[project]
name = "lms-api"
version = "0.1.0"
description = ""
authors = [
    {name = "Margarita Bursheva",email = "mbursheva@mail.ru"}
]
readme = "README.md"
requires-python = ">=3.13,<4.0"
dependencies = [
    "django (>=6.0.5,<7.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "psycopg2-binary (>=2.9.12,<3.0.0)",
    "pillow (>=12.2.0,<13.0.0)",
    "djangorestframework (>=3.17.1,<4.0.0)",
    "django-filter (>=25.2,<26.0)",
    "djangorestframework-simplejwt (>=5.5.1,<6.0.0)",
    "coverage (>=7.14.1,<8.0.0)",
    "drf-yasg (>=1.21.15,<2.0.0)",
    "stripe (>=15.2.0,<16.0.0)",
    "celery (>=5.6.3,<6.0.0)",
    "redis (==4.6.0)",
    "gunicorn (>=26.0.0,<27.0.0)",
    "django-celery-beat (>=2.9.0,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
disallow_untyped_defs = true
warn_return_any = true
exclude = 'venv'

[tool.black]
target-version = ['py313']
line-length = 119
exclude = '.git'

[tool.isort]
line_length = 119

[tool.poetry.group.dev.dependencies]
mypy = "^2.1.0"
black = "^26.5.1"
isort = "^8.0.1"
flake8 = "^7.3.0"

